spring.application.name=pv-case-service

server.port=${SERVER_PORT:8080}
# Shut down in-flight requests cleanly so `run.sh stop` and container SIGTERM
# do not sever a merge midway.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Bootstrap case. Overridable so the container can be pointed at a different
# seed file without a rebuild.
pvcase.bootstrap.location=classpath:case_v1.json
pvcase.bootstrap.case-id=PV-2026-0451

# Reported by GET /health. Set at image build time.
pvcase.version=@project.version@

# Reviewer UI dev origins. Comma-separated; never widen this to "*".
pvcase.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000

# Return a 404 through the exception handler rather than Spring's default
# error page, so unknown paths get the same JSON envelope as everything else.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
